plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.njfu.schedule'
    compileSdk 35

    defaultConfig {
        applicationId "com.njfu.schedule"
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName "2.3.0"
    }

    // 签名密钥信息放在【不入库】的 keystore.properties（含密码）。缺失时 release 不签名。
    def keystoreProps = new Properties()
    def ksf = rootProject.file("keystore.properties")
    if (ksf.exists()) {
        ksf.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        release {
            if (ksf.exists()) {
                storeFile file(keystoreProps['storeFile'] ?: 'njfu-release.jks')
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (ksf.exists()) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    // 稳定性配置：Course/Schedule/AppColors 标记为 stable，内容不变时跳过重组（见 compose_compiler_config.conf）
    composeCompiler {
        stabilityConfigurationFile = rootProject.file("app/compose_compiler_config.conf")
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.webkit:webkit:1.11.0'
    // 桌面小组件（基于 Compose 运行时）。1.2.0 是当前稳定版；不要与主界面的 Compose UI 混用。
    implementation 'androidx.glance:glance-appwidget:1.2.0'
    // 解析教务系统 HTML 课表
    implementation 'org.jsoup:jsoup:1.18.1'
    // 存 JSON（课表/设置）
    implementation 'com.google.code.gson:gson:2.11.0'

    // JVM 单元测试（解析器回归）
    testImplementation 'junit:junit:4.13.2'

    // Robolectric：在 JVM 上跑安卓/Compose（无需模拟器 / KVM），用于 UI 自动化回归
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation composeBom
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation composeBom
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
