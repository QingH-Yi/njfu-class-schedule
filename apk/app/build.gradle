plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.njfu.schedule'
    compileSdk 35

    defaultConfig {
        applicationId "com.njfu.schedule"
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile file('njfu-release.jks')
            storePassword 'njfu2026'
            keyAlias 'njfu'
            keyPassword 'njfu2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.webkit:webkit:1.11.0'
    // 解析教务系统 HTML 课表
    implementation 'org.jsoup:jsoup:1.18.1'
    // 存 JSON（课表/设置）
    implementation 'com.google.code.gson:gson:2.11.0'

    // JVM 单元测试（解析器回归）
    testImplementation 'junit:junit:4.13.2'

    // Robolectric：在 JVM 上跑安卓/Compose（无需模拟器 / KVM），用于 UI 自动化回归
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation composeBom
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation composeBom
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
